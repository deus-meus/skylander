services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://skylander.co.id}
    container_name: skylander-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-https://skylander.co.id}
