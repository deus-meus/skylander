services:
  web:
    image: ghcr.io/${GH_OWNER:-deus-meus}/skylander-web:latest
    container_name: skylander_web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-https://skylander.co.id}

  watchtower:
    image: containrrr/watchtower:latest
    container_name: skylander_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - DOCKER_API_VERSION=1.44
      - REPO_USER=${GH_OWNER:-deus-meus}
      - REPO_PASS=${GITHUB_TOKEN}
    command: --interval 60 skylander_web
